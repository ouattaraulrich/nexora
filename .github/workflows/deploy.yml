name: 🚀 Deploy Nexora to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:  # Déclenchement manuel possible

jobs:
  lint:
    name: 🔍 PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: 🔍 Lint PHP files
        run: |
          echo "Checking PHP syntax..."
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "❌ Syntax error: $file"
              php -l "$file"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find . -name "*.php" -not -path "./.git/*" -print0)
          if [ $ERRORS -eq 0 ]; then
            echo "✅ All PHP files OK"
          else
            echo "❌ $ERRORS file(s) with syntax errors"
            exit 1
          fi

  deploy:
    name: 🚂 Deploy to Railway
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚂 Install Railway CLI & Deploy
        run: |
          npm install -g @railway/cli
          railway up --service nexora-php --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  notify:
    name: 📣 Notify Result
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: ✅ Deployment succeeded
        if: needs.deploy.result == 'success'
        run: echo "✅ Nexora déployé avec succès sur Railway!"

      - name: ❌ Deployment failed
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ Le déploiement a échoué. Vérifier les logs Railway."
          exit 1
