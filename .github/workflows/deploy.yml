name: 🚀 Deploy Nexora to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:  # Déclenchement manuel possible

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout du code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Vérification syntaxe PHP
      - name: 🔍 Lint PHP files
        uses: php-actions/composer@v6
        with:
          php_version: "8.2"
          command: |
            find . -name "*.php" -not -path "./.git/*" \
              -exec php -l {} \; | grep -v "No syntax errors"
        continue-on-error: true

      # 3. Installation Railway CLI et déploiement
      - name: 🚂 Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: nexora-php

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: ❌ Deployment failed
        run: echo "Le déploiement a échoué. Vérifier les logs Railway."
